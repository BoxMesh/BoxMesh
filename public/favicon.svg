<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Zin's octopus. Follows the browser's colour scheme, not the app's theme toggle: the tab bar is drawn by the
       browser, and prefers-color-scheme inside the SVG is the closest a page gets to its colour. Transparent, so
       the mark sits straight on the tab bar. Drawn for 16px: a solid head and four heavy arms, no fine detail. -->
  <style>
    .mark { fill: #101416; stroke: #101416; }
    .eye { fill: #ea580c; }
    @media (prefers-color-scheme: dark) {
      .mark { fill: #f1efe7; stroke: #f1efe7; }
      .eye { fill: #fb923c; }
    }
  </style>
  <circle class="mark" stroke="none" cx="24" cy="20" r="14"/>
  <g class="mark" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 27C12 36 7 37 6 43"/>
    <path d="M19.5 31C19.5 38 16 40 17 44"/>
    <path d="M28.5 31C28.5 38 32 40 31 44"/>
    <path d="M35 27C36 36 41 37 42 43"/>
  </g>
  <circle class="eye" cx="18.5" cy="20" r="3"/>
  <circle class="eye" cx="29.5" cy="20" r="3"/>
</svg>
